<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CAR5 Racing - High Speed Retro Arcade Simulator">
    <title>CAR5 Racing | Retro Arcade Experience</title>
    <!-- Fuente moderna de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #080b12;
            --primary: #f5d122; /* Amarillo brillante del HUD */
            --secondary: #00d4ff; /* Azul neón */
            --text-main: #ffffff;
            --text-muted: #8892b0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            /* Patrón de cuadrícula retro de fondo */
            background-image: 
                linear-gradient(rgba(8, 11, 18, 0.9), rgba(8, 11, 18, 0.9)),
                linear-gradient(var(--secondary) 1px, transparent 1px),
                linear-gradient(90deg, var(--secondary) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            background-position: center bottom;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Contenedor principal centralizado */
        .hero {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            animation: fadeIn 1.5s ease-out;
        }

        /* Título del juego */
        .title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(4rem, 10vw, 8rem);
            font-weight: 900;
            line-height: 1;
            margin-bottom: 0.5rem;
            letter-spacing: -2px;
            color: transparent;
            -webkit-text-stroke: 2px var(--primary);
            position: relative;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(245, 209, 34, 0.4);
        }

        /* Texto sólido por encima para efecto 3D */
        .title::before {
            content: "CAR5";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            color: var(--primary);
            -webkit-text-stroke: 0;
            clip-path: polygon(0 0, 100% 0, 100% 55%, 0 55%);
        }

        .subtitle {
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 1.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .description {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 3rem;
            line-height: 1.6;
        }

        /* Botón de Jugar */
        .play-btn {
            display: inline-block;
            padding: 1rem 3rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--bg-color);
            background: var(--secondary);
            text-decoration: none;
            text-transform: uppercase;
            border-radius: 50px;
            letter-spacing: 2px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
            border: 2px solid transparent;
        }

        /* Animación Hover del Botón */
        .play-btn:hover {
            background: transparent;
            color: var(--secondary);
            border-color: var(--secondary);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.6), inset 0 0 20px rgba(0, 212, 255, 0.4);
            transform: translateY(-5px);
        }

        .play-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300%;
            height: 300%;
            background: rgba(255, 255, 255, 0.1);
            transform: translate(-50%, -50%) rotate(45deg) translateY(100%);
            transition: transform 0.6s ease;
        }

        .play-btn:hover::after {
            transform: translate(-50%, -50%) rotate(45deg) translateY(0);
        }

        /* Animación de entrada */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Detalles de fondo animados (partículas de velocidad) */
        .speed-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .line {
            position: absolute;
            width: 2px;
            height: 15vh;
            background: linear-gradient(to bottom, transparent, var(--primary), transparent);
            opacity: 0.3;
            animation: speedFall linear infinite;
        }

        @keyframes speedFall {
            0% { transform: translateY(-100vh); opacity: 0;}
            50% { opacity: 0.5; }
            100% { transform: translateY(100vh); opacity: 0;}
        }
    </style>
</head>
<body>

    <!-- Efecto visual de líneas de velocidad cayendo -->
    <div class="speed-lines" id="lines-container"></div>

    <main class="hero">
        <h1 class="title">CAR5</h1>
        <h2 class="subtitle">Retro Arcade Racing</h2>
        <p class="description">
            Experimenta la adrenalina pura a más de 300 KM/H en este simulador arcade de carreras en óvalo. Toma el control total sin soltar el acelerador.
        </p>
        
        <!-- Enlace apuntando a la carpeta de tu exportación de Godot -->
        <a href="HTMLS/index.html" class="play-btn">Jugar Ahora</a>
    </main>

    <script>
        // Script simple para generar líneas de velocidad de fondo dinámicamente
        const linesContainer = document.getElementById('lines-container');
        for (let i = 0; i < 20; i++) {
            let line = document.createElement('div');
            line.className = 'line';
            line.style.left = Math.random() * 100 + 'vw';
            line.style.animationDuration = (Math.random() * 1 + 0.5) + 's';
            line.style.animationDelay = Math.random() * 2 + 's';
            linesContainer.appendChild(line);
        }
    </script>
</body>
</html>
